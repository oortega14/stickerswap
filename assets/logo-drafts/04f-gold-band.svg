<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 4f: Gold sin rojo + banda MUNDIAL legible (texto grande, no decoración perdida) -->
  <rect width="1024" height="1024" fill="#1a1410"/>

  <!-- Banda dorada inferior, alta y con texto en negativo grande -->
  <rect x="0" y="868" width="1024" height="156" fill="#D4A24C"/>

  <!-- "2" -->
  <text x="320" y="730" font-family="Impact, 'Arial Black', sans-serif" font-size="780" font-weight="900" letter-spacing="-20" text-anchor="middle" fill="#D4A24C">2</text>

  <!-- "6" -->
  <g transform="translate(700 500)">
    <path d="M 80 -290 Q -160 -200 -200 60" fill="none" stroke="#D4A24C" stroke-width="92" stroke-linecap="round"/>
    <circle r="190" fill="#FAF6F0"/>
    <polygon points="0,-104 100,-32 62,86 -62,86 -100,-32" fill="#1a1410"/>
    <line x1="0" y1="-104" x2="0" y2="-190" stroke="#1a1410" stroke-width="14" stroke-linecap="round"/>
    <line x1="100" y1="-32" x2="180" y2="-58" stroke="#1a1410" stroke-width="14" stroke-linecap="round"/>
    <line x1="62" y1="86" x2="112" y2="162" stroke="#1a1410" stroke-width="14" stroke-linecap="round"/>
    <line x1="-62" y1="86" x2="-112" y2="162" stroke="#1a1410" stroke-width="14" stroke-linecap="round"/>
    <line x1="-100" y1="-32" x2="-180" y2="-58" stroke="#1a1410" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- MUNDIAL en la banda, grande y legible -->
  <text x="512" y="985" font-family="Impact, 'Arial Black', sans-serif" font-size="92" font-weight="900" letter-spacing="14" text-anchor="middle" fill="#1a1410">MUNDIAL</text>
</svg>
